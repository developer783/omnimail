services:
  # OmniMail Web Service (FastAPI Backend + React UI Bundle)
  - type: web
    name: omnimail
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omnimail-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://omnimail.onrender.com/auth/google/callback
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SHARED_USERNAME
        value: admin
      - key: SHARED_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://omnimail.onrender.com

databases:
  # PostgreSQL Database Instance
  - name: omnimail-db
    databaseName: omnimail
    user: omnimail_user
    plan: free
    region: oregon
