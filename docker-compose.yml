version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnimail-postgres
    restart: always
    environment:
      POSTGRES_USER: omnimail
      POSTGRES_PASSWORD: omnimail_password
      POSTGRES_DB: omnimail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
